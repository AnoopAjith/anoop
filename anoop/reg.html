<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f2f2f2;">

    <div style="width: 400px; margin: 50px auto; padding: 25px; background-color: white; border-radius: 10px; box-shadow: 0 0 10px #aaa;">

        <h2 style="text-align: center; color: #333;">Registration Form</h2>

        <form>
            <label style="display: block; margin-top: 10px;">Full Name:</label>
            <input type="text" placeholder="Enter your name"
                   style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;">

            <label style="display: block; margin-top: 15px;">Email:</label>
            <input type="email" placeholder="Enter your email"
                   style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;">

            <label style="display: block; margin-top: 15px;">Password:</label>
            <input type="password" placeholder="Enter your password"
                   style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;">

            <label style="display: block; margin-top: 15px;">Phone Number:</label>
            <input type="tel" placeholder="Enter your phone number"
                   style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;">

            <label style="display: block; margin-top: 15px;">Gender:</label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other

            <label style="display: block; margin-top: 15px;">Date of Birth:</label>
            <input type="date"
                   style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;">

            <button type="submit"
                    style="width: 100%; padding: 12px; margin-top: 25px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">
                Register
            </button>

        </form>
    </div>

</body>
</html>
