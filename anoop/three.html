<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline, Internal, and External CSS Example</title>
    
    <!-- External CSS Link -->
    <link rel="stylesheet" href="exter.css">
    
    <!-- Internal CSS Styles -->
    <style>
        h2 {
            color: green;
            font-family: Georgia, serif;
        }
        .page-description {
            font-size: 16px;
            background-color: #f2f2f2;
            padding: 5px;
        }
    </style>
</head>
<body>

    <!-- Styled using External CSS (from style.css) -->
    <h1>Welcome to My Website</h1>

    <!-- Styled using Internal CSS (from the <style> block above) -->
    <h2>About Our Services</h2>

    <!-- Styled using Internal CSS class -->
    <p class="page-description">This paragraph is styled using an internal class selector.</p>

    <!-- Styled using Inline CSS (direct override on this specific tag) -->
    <p style="color: red; font-weight: bold;">This specific text uses Inline CSS and appears in red.</p>

</body>
</html>
